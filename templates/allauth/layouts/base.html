{% extends "core/base.html" %}

{% block body %}
<div class="container mx-auto flex-1 max-w-lg px-4 py-8">
    {% if messages %}
        <div class="container mx-auto p-6 space-y-4">
            {% for message in messages %}
            <div role="alert"
                class="alert {% if message.tags == 'success' %}alert-success{% elif message.tags == 'error' %}alert-error{% else %}alert-info{% endif %}">
                <span>{{ message }}</span>
            </div>
            {% endfor %}
        </div>
    {% endif %}
    {% block content %}

    {% endblock content %}
</div>
{% endblock body %}
