{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <title>Server Error</title>
    <meta charset="utf-8" />
    <meta name="description" content="Something went wrong on our end. Please try again later." />
    <meta name="keywords" content="500, server error, error" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="color-scheme" content="light dark" />
    <link href="{% static 'css/output.css' %}" rel="stylesheet" type="text/css" />
</head>

<body class="flex flex-col min-h-screen">
    <main class="flex-1 flex flex-col">
        <div class="hero bg-base-200 flex-1">
            <div class="hero-content text-center">
                <div class="max-w-md">
                    <h1 class="text-8xl font-bold opacity-20">500</h1>
                    <h2 class="text-3xl font-bold mt-4">Server Error</h2>
                    <p class="py-6 text-base-content/70">
                        Something went wrong on our end. Please try again later.
                    </p>
                    <a href="{% url 'pages:home' %}" class="btn btn-primary">Go Home</a>
                </div>
            </div>
        </div>
    </main>

</html>
