#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'sarahandfrankwedding'
primary_region = 'ewr'
console_command = '/code/manage.py shell'

[build]

[env]
  PORT = '8000'
  TRUSTED_CLIENT_IP_HEADER = 'Fly-Client-IP'
  MALLOC_ARENA_MAX = '2'

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [[http_service.checks]]
    grace_period = "20s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/health/"
    protocol = "http"

[[vm]]
  memory = '1024mb'
  cpus = 1

[[statics]]
  guest_path = '/code/staticfiles'
  url_prefix = '/static/'

[mounts]
  source = "wedding_data"
  destination = "/data"
