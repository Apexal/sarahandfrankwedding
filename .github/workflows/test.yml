name: CI

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v9.0.0
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  test:
    name: Test
    runs-on: ubuntu-latest
    env:
      SECRET_KEY: ci-only-not-a-real-secret
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v9.0.0
      - run: uv sync --locked
      - name: Check for missing migrations
        run: uv run ./manage.py makemigrations --check
      - run: uv run pytest
