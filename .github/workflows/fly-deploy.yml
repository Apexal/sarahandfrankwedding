# See https://fly.io/docs/app-guides/continuous-deployment-with-github-actions/
# Every merge to main deploys production once the test suite passes.

name: Fly Deploy

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/test.yml

  deploy-production:
    name: Deploy to production
    needs: test
    runs-on: ubuntu-latest
    # Lets GitHub restrict FLY_API_TOKEN to this environment (and to main) —
    # move the secret there and add protection rules in the repo settings.
    environment: production
    concurrency:
      group: fly-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: superfly/flyctl-actions/setup-flyctl@1.6
      - run: flyctl deploy --remote-only --ha=false
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
