name: Release Please

on:
  push:
    branches:
      - main

# Nothing by default; each job asks for what it needs, so the deploy job (which
# holds FLY_API_TOKEN) never also holds a repo-write token.
permissions: {}

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          # Configuration files are in the repo root
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # When release-please creates or updates a PR, sync uv.lock
      # so it matches the bumped version in pyproject.toml.
      - uses: actions/checkout@v7
        if: steps.release.outputs.prs_created == 'true'
        with:
          ref: ${{ fromJson(steps.release.outputs.pr).headBranchName }}
      - uses: astral-sh/setup-uv@v7
        if: steps.release.outputs.prs_created == 'true'
      - name: Update uv.lock
        if: steps.release.outputs.prs_created == 'true'
        run: |
          uv lock
          if git diff --quiet uv.lock; then
            echo "uv.lock already up to date"
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add uv.lock
            git commit -m "chore: update uv.lock for version bump"
            git push
          fi
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}

  test:
    uses: ./.github/workflows/test.yml
    permissions:
      contents: read

  deploy-production:
    name: Deploy to production
    needs: [release-please, test]
    if: needs.release-please.outputs.releases_created == 'true'
    runs-on: ubuntu-latest
    # Lets GitHub restrict FLY_API_TOKEN to this environment (and to main) —
    # move the secret there and add protection rules in the repo settings.
    environment: production
    permissions:
      contents: read
    concurrency:
      group: fly-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: superfly/flyctl-actions/setup-flyctl@1.6
      - run: flyctl deploy --remote-only --ha=false
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
